<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FILA 图片选择 Debug</title>
    <link rel="stylesheet" href="styles.css" />
    <script>
      (function redirectToDetail() {
        const u = new URL(window.location.href)
        if (u.searchParams.get('raw') === '1') {
          return
        }
        const sid = u.searchParams.get('sku_id')
        const pid = u.searchParams.get('spu_id')
        if (sid) {
          const t = new URL('sku-detail.html', u.href)
          t.search = u.search
          window.location.replace(t.toString())
          return
        }
        if (pid) {
          const t = new URL('spu-detail.html', u.href)
          t.search = u.search
          window.location.replace(t.toString())
        }
      })()
    </script>
  </head>
  <body>
    <header class="top">
      <h1>图片选择 Debug</h1>
      <form class="search" id="search-form">
        <input
          type="text"
          id="q"
          placeholder="输入 sku_id 或 spu_id"
          autocomplete="off"
        />
        <button type="submit">打开详情</button>
      </form>
    </header>
    <main id="main">
      <p class="hint">
        默认进入与 <code>outfits-viewer</code> 同风格的
        <strong>商品详情卡片页</strong>（<code>sku-detail.html</code>）。
        数据来自 FastAPI <code>/skus/{sku_id}</code> 全量字段。
      </p>
      <p class="hint">
        仍查看原始 JSON：提交后在地址栏把
        <code>sku-detail.html</code> 改回 <code>index.html</code> 并加
        <code>&amp;raw=1</code>，或使用顶部「仅 JSON」模式（见下）。
      </p>
      <p class="hint">
        <label>
          <input type="checkbox" id="raw-only" />
          仅显示 JSON（旧版行为）
        </label>
      </p>
      <pre id="json-out"></pre>
    </main>
    <script src="app.js"></script>
  </body>
</html>
