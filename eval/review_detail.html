<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FILA 搭配评测 · 详情</title>
    <link rel="stylesheet" href="review_styles.css" />
    <script>
      (function () {
        var saved = localStorage.getItem('fila_eval_theme');
        if (saved === 'light' || saved === 'dark') {
          document.documentElement.dataset.theme = saved;
        } else {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <header class="app-header">
      <div>
        <h1 id="pageTitle">FILA 搭配评测</h1>
        <p class="subtitle"><a id="backLink" href="review.html" class="back-link">&larr; 返回总览</a></p>
      </div>
      <nav class="header-actions">
        <button id="btnTheme" type="button" class="btn theme-toggle"
          aria-label="切换白天/黑夜模式" title="切换白天/黑夜模式">
          <span class="theme-icon theme-icon-sun" aria-hidden="true">&#9728;</span>
          <span class="theme-icon theme-icon-moon" aria-hidden="true">&#9789;</span>
        </button>
      </nav>
    </header>

    <main class="layout">
      <section class="panel panel-wide panel-results">
        <h2 id="resultTitle">加载中...</h2>
        <div id="resultList" class="result-list"></div>
      </section>
    </main>

    <script src="review_detail.js" type="module"></script>
  </body>
</html>
