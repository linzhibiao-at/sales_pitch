<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FILA 搭配缺陷报告 · Defect Dashboard</title>
<style>
:root {
  --bg: #f5f5f7; --surface: #fff; --border: #e5e5ea;
  --text: #1d1d1f; --text2: #6e6e73; --accent: #0071e3;
  --high: #ff3b30; --medium: #ff9500; --low: #34c759; --none: #8e8e93;
}
[data-theme="dark"] {
  --bg: #1c1c1e; --surface: #2c2c2e; --border: #48484a;
  --text: #f5f5f7; --text2: #a1a1a6; --accent: #0a84ff;
}
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg); color: var(--text); font-size: 14px;
}
header {
  background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 12px 24px; display: flex; justify-content: space-between; align-items: center;
}
header h1 { margin: 0; font-size: 18px; }
.subtitle { margin: 2px 0 0; color: var(--text2); font-size: 12px; }
.btn {
  background: none; border: 1px solid var(--border); border-radius: 6px;
  padding: 6px 12px; cursor: pointer; color: var(--text); font-size: 12px;
}
.btn:hover { background: var(--bg); }
.btn-active { background: var(--accent); color: #fff; border-color: var(--accent); }
.container { max-width: 1200px; margin: 0 auto; padding: 16px 24px; }

/* Summary cards */
.summary-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 12px; margin-bottom: 16px;
}
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
  padding: 12px 16px;
}
.card-label { font-size: 11px; color: var(--text2); text-transform: uppercase; letter-spacing: 0.5px; }
.card-value { font-size: 24px; font-weight: 700; margin: 4px 0; }
.card-sub { font-size: 12px; color: var(--text2); }

/* Severity badges */
.badge {
  display: inline-block; padding: 2px 8px; border-radius: 4px;
  font-size: 11px; font-weight: 600; text-transform: uppercase;
}
.badge-high { background: var(--high); color: #fff; }
.badge-medium { background: var(--medium); color: #fff; }
.badge-low { background: var(--low); color: #fff; }
.badge-none { background: var(--none); color: #fff; }

/* Filters */
.filters {
  display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; align-items: center;
}
.filters label { font-size: 12px; color: var(--text2); }
.filters select, .filters input {
  background: var(--surface); border: 1px solid var(--border); border-radius: 4px;
  padding: 4px 8px; font-size: 12px; color: var(--text);
}

/* Defect table */
table { width: 100%; border-collapse: collapse; }
th {
  text-align: left; padding: 8px 10px; font-size: 11px; text-transform: uppercase;
  color: var(--text2); border-bottom: 2px solid var(--border); position: sticky; top: 0;
  background: var(--surface);
}
td {
  padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top;
  font-size: 13px;
}
tr:hover td { background: rgba(0,113,227,0.05); }

.defect-list { list-style: none; margin: 0; padding: 0; }
.defect-item {
  padding: 6px 8px; margin: 4px 0; border-left: 3px solid var(--border);
  background: rgba(255,255,255,0.5);
}
[data-theme="dark"] .defect-item { background: rgba(255,255,255,0.03); }
.defect-item.severity-high { border-left-color: var(--high); }
.defect-item.severity-medium { border-left-color: var(--medium); }
.defect-item.severity-low { border-left-color: var(--low); }
.defect-detail { color: var(--text2); font-size: 12px; margin-top: 2px; }
.defect-suggestion { color: var(--accent); font-size: 12px; margin-top: 2px; }

/* Expand/collapse */
.expandable { cursor: pointer; }
.expandable::before {
  content: '▶'; display: inline-block; margin-right: 4px;
  transition: transform 0.15s; font-size: 10px;
}
.expandable.open::before { transform: rotate(90deg); }
.hidden { display: none; }

/* File upload */
.upload-area {
  border: 2px dashed var(--border); border-radius: 12px; padding: 32px;
  text-align: center; margin: 24px 0; cursor: pointer;
  transition: border-color 0.2s;
}
.upload-area:hover { border-color: var(--accent); }
.upload-area.dragover { border-color: var(--accent); background: rgba(0,113,227,0.05); }

/* Bar chart */
.bar-chart { display: flex; gap: 8px; align-items: end; height: 80px; margin-top: 8px; }
.bar-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; }
.bar {
  width: 100%; border-radius: 4px 4px 0 0; transition: height 0.3s;
  min-height: 2px;
}
.bar-label { font-size: 10px; color: var(--text2); margin-top: 4px; text-align: center; }
.bar-value { font-size: 10px; font-weight: 600; margin-bottom: 2px; }
</style>
</head>
<body>
<header>
  <div>
    <h1>FILA 搭配缺陷报告</h1>
    <p class="subtitle">属性匹配缺陷自动检测 · 6 维缺陷分析</p>
  </div>
  <div>
    <button class="btn" id="btnTheme" title="切换主题">🌙</button>
    <button class="btn" id="btnExport" title="导出 CSV" disabled>导出 CSV</button>
  </div>
</header>

<div class="container">
  <!-- File loader -->
  <div class="upload-area" id="uploadArea">
    <p>📂 点击或拖拽加载 <code>defect_report.json</code></p>
    <p style="font-size:12px;color:var(--text2)">支持 batch_defect_eval.py 输出的 JSON 文件</p>
    <input type="file" id="fileInput" accept=".json" style="display:none" />
  </div>

  <!-- Main content (hidden until loaded) -->
  <div id="mainContent" style="display:none">
    <!-- Summary -->
    <div class="summary-grid" id="summaryGrid"></div>

    <!-- Bar chart -->
    <div class="card" style="margin-bottom:16px">
      <div class="card-label">缺陷类型分布</div>
      <div class="bar-chart" id="barChart"></div>
    </div>

    <!-- Filters -->
    <div class="filters">
      <label>缺陷类型</label>
      <select id="filterType">
        <option value="">全部</option>
      </select>
      <label>严重程度</label>
      <select id="filterSeverity">
        <option value="">全部</option>
        <option value="HIGH">HIGH</option>
        <option value="MEDIUM">MEDIUM</option>
        <option value="LOW">LOW</option>
      </select>
      <label>搜索</label>
      <input type="text" id="filterSearch" placeholder="SKU / 搭配 / 单品..." style="width:200px" />
      <span id="filterCount" style="color:var(--text2);font-size:12px"></span>
    </div>

    <!-- Table -->
    <div class="card" style="overflow-x:auto">
      <table>
        <thead>
          <tr>
            <th style="width:50px">#</th>
            <th style="width:120px">输入 SKU</th>
            <th style="width:140px">搭配 ID</th>
            <th style="width:80px">缺陷数</th>
            <th style="width:80px">最高级别</th>
            <th>缺陷详情</th>
          </tr>
        </thead>
        <tbody id="defectTable"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
(function() {
  'use strict';

  let REPORT = null;
  const TYPE_LABELS = {
    gender_conflict: '性别冲突',
    season_mismatch: '季节不匹配',
    role_missing: '角色缺失',
    category_l2_violation: '中类违规',
    color_series_conflict: '色系冲突',
    price_overrun: '预算超标'
  };
  const TYPE_COLORS = {
    gender_conflict: '#ff3b30',
    season_mismatch: '#ff9500',
    role_missing: '#ffcc00',
    category_l2_violation: '#af52de',
    color_series_conflict: '#007aff',
    price_overrun: '#8e8e93'
  };

  // Theme toggle
  const btnTheme = document.getElementById('btnTheme');
  btnTheme.addEventListener('click', () => {
    const html = document.documentElement;
    const isDark = html.dataset.theme === 'dark';
    html.dataset.theme = isDark ? 'light' : 'dark';
    btnTheme.textContent = isDark ? '🌙' : '☀️';
    localStorage.setItem('fila_defect_theme', html.dataset.theme);
  });
  const savedTheme = localStorage.getItem('fila_defect_theme');
  if (savedTheme) {
    document.documentElement.dataset.theme = savedTheme;
    btnTheme.textContent = savedTheme === 'dark' ? '☀️' : '🌙';
  }

  // File upload
  const uploadArea = document.getElementById('uploadArea');
  const fileInput = document.getElementById('fileInput');
  uploadArea.addEventListener('click', () => fileInput.click());
  uploadArea.addEventListener('dragover', e => {
    e.preventDefault(); uploadArea.classList.add('dragover');
  });
  uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('dragover'));
  uploadArea.addEventListener('drop', e => {
    e.preventDefault(); uploadArea.classList.remove('dragover');
    if (e.dataTransfer.files.length) loadFile(e.dataTransfer.files[0]);
  });
  fileInput.addEventListener('change', () => {
    if (fileInput.files.length) loadFile(fileInput.files[0]);
  });

  function loadFile(file) {
    const reader = new FileReader();
    reader.onload = e => {
      try {
        REPORT = JSON.parse(e.target.result);
        uploadArea.style.display = 'none';
        document.getElementById('mainContent').style.display = '';
        document.getElementById('btnExport').disabled = false;
        render();
      } catch (err) {
        alert('JSON 解析失败: ' + err.message);
      }
    };
    reader.readAsText(file);
  }

  // Also try loading from URL param ?file=
  const params = new URLSearchParams(location.search);
  const fileUrl = params.get('file');
  if (fileUrl) {
    fetch(fileUrl).then(r => r.json()).then(data => {
      REPORT = data;
      uploadArea.style.display = 'none';
      document.getElementById('mainContent').style.display = '';
      document.getElementById('btnExport').disabled = false;
      render();
    }).catch(err => console.error('Failed to load from URL:', err));
  }

  function render() {
    renderSummary();
    renderBarChart();
    renderFilters();
    renderTable();
  }

  function renderSummary() {
    const s = REPORT.summary || {};
    const grid = document.getElementById('summaryGrid');
    const cards = [
      { label: '搭配总数', value: s.total_outfits || 0, sub: '' },
      { label: '有缺陷', value: s.outfits_with_defects || 0,
        sub: s.defect_rate ? (s.defect_rate * 100).toFixed(1) + '%' : '' },
      { label: '缺陷总数', value: s.total_defect_count || 0, sub: '' },
      { label: 'HIGH', value: (s.by_severity || {}).HIGH || 0, cls: 'badge-high' },
      { label: 'MEDIUM', value: (s.by_severity || {}).MEDIUM || 0, cls: 'badge-medium' },
      { label: 'LOW', value: (s.by_severity || {}).LOW || 0, cls: 'badge-low' },
    ];
    grid.innerHTML = cards.map(c => `
      <div class="card">
        <div class="card-label">${c.label}</div>
        <div class="card-value" ${c.cls ? 'style="color:var(--' + c.cls.replace('badge-', '') + ')"' : ''}>${c.value}</div>
        <div class="card-sub">${c.sub}</div>
      </div>
    `).join('');
  }

  function renderBarChart() {
    const byType = (REPORT.summary || {}).by_type || {};
    const chart = document.getElementById('barChart');
    const entries = Object.entries(byType);
    const maxVal = Math.max(...entries.map(([,v]) => v), 1);
    chart.innerHTML = entries.map(([type, count]) => `
      <div class="bar-wrap">
        <div class="bar-value">${count}</div>
        <div class="bar" style="height:${Math.max(count / maxVal * 60, 2)}px;background:${TYPE_COLORS[type] || '#8e8e93'}"></div>
        <div class="bar-label">${TYPE_LABELS[type] || type}</div>
      </div>
    `).join('');
  }

  function renderFilters() {
    const sel = document.getElementById('filterType');
    sel.innerHTML = '<option value="">全部</option>' +
      Object.keys(TYPE_LABELS).map(t =>
        `<option value="${t}">${TYPE_LABELS[t]}</option>`
      ).join('');
    sel.addEventListener('change', renderTable);
    document.getElementById('filterSeverity').addEventListener('change', renderTable);
    document.getElementById('filterSearch').addEventListener('input', renderTable);
  }

  function renderTable() {
    const filterType = document.getElementById('filterType').value;
    const filterSev = document.getElementById('filterSeverity').value;
    const filterSearch = document.getElementById('filterSearch').value.toLowerCase();
    const details = (REPORT.details || []).filter(d => {
      if (!d.defects || !d.defects.length) return false;
      let match = false;
      for (const def of d.defects) {
        if (filterType && def.defect_type !== filterType) continue;
        if (filterSev && def.severity !== filterSev) continue;
        if (filterSearch) {
          const hay = [d.outfit_id, d.input_sku_id, def.item_sku_id, def.item_title, def.detail]
            .join(' ').toLowerCase();
          if (!hay.includes(filterSearch)) continue;
        }
        match = true; break;
      }
      return match;
    });

    document.getElementById('filterCount').textContent =
      `显示 ${details.length} / ${REPORT.details ? REPORT.details.length : 0} 套`;

    const tbody = document.getElementById('defectTable');
    if (!details.length) {
      tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:24px;color:var(--text2)">无匹配结果</td></tr>';
      return;
    }

    tbody.innerHTML = details.map((d, idx) => {
      const maxSev = maxSeverity(d.defects);
      const defectsHtml = d.defects
        .filter(def => {
          if (filterType && def.defect_type !== filterType) return false;
          if (filterSev && def.severity !== filterSev) return false;
          return true;
        })
        .map(def => `
          <li class="defect-item severity-${def.severity.toLowerCase()}">
            <span class="badge badge-${def.severity.toLowerCase()}">${def.severity}</span>
            <strong>${TYPE_LABELS[def.defect_type] || def.defect_type}</strong>
            ${def.item_sku_id ? `<code>${def.item_sku_id}</code>` : ''}
            ${def.item_title ? ` · ${def.item_title}` : ''}
            <div class="defect-detail">${def.detail}</div>
            <div class="defect-suggestion">💡 ${def.suggestion}</div>
          </li>
        `).join('');

      return `
        <tr>
          <td>${idx + 1}</td>
          <td><code>${d.input_sku_id || '-'}</code></td>
          <td><code style="font-size:11px">${d.outfit_id || '-'}</code></td>
          <td style="text-align:center">${d.defect_count || d.defects.length}</td>
          <td><span class="badge badge-${maxSev.toLowerCase()}">${maxSev}</span></td>
          <td><ul class="defect-list">${defectsHtml}</ul></td>
        </tr>
      `;
    }).join('');
  }

  function maxSeverity(defects) {
    const order = { HIGH: 3, MEDIUM: 2, LOW: 1 };
    let best = 'NONE';
    for (const d of defects) {
      if ((order[d.severity] || 0) > (order[best] || 0)) best = d.severity;
    }
    return best;
  }

  // Export CSV
  document.getElementById('btnExport').addEventListener('click', () => {
    if (!REPORT) return;
    const rows = [['outfit_id', 'input_sku_id', 'defect_type', 'severity', 'item_sku_id', 'item_title', 'detail', 'suggestion']];
    for (const d of REPORT.details || []) {
      for (const def of d.defects || []) {
        rows.push([
          d.outfit_id, d.input_sku_id, def.defect_type, def.severity,
          def.item_sku_id || '', def.item_title || '',
          def.detail.replace(/,/g, '，'), def.suggestion.replace(/,/g, '，')
        ]);
      }
    }
    const csv = rows.map(r => r.map(c => `"${c}"`).join(',')).join('\n');
    const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'defect_report.csv';
    a.click(); URL.revokeObjectURL(url);
  });
})();
</script>
</body>
</html>
