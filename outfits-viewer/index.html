<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  />
  <title>FILA 穿搭浏览</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body class="viewer-page">

  <header>
    <h1>FILA 穿搭浏览</h1>
    <div
      id="title-meta"
      class="meta"
    >准备中…</div>
    <div class="header-links">
      <a
        href="outfit.html"
        title="在地址栏追加 ?idMatch=搭配ID，例如 outfit.html?idMatch=8945"
      >单套搭配</a>
    </div>
  </header>

  <nav
    id="source-tabs"
    class="filter-tabs source-tabs"
    aria-label="搭配来源"
  ></nav>

  <nav
    id="color-series-tabs"
    class="filter-tabs color-series-tabs"
    aria-label="色系标签"
  ></nav>

  <nav
    id="season-tabs"
    class="filter-tabs season-tabs"
    aria-label="季节"
  ></nav>

  <div id="scroll-root">
    <div id="outfit-list"></div>
    <div id="load-sentinel">向下滚动加载更多</div>
  </div>

  <script src="viewer-common.js"></script>
  <script src="app.js"></script>
</body>

</html>
