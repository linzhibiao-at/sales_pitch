kind: Deployment
apiVersion: apps/v1
metadata:
  name: fila-outfit-prod
  namespace: f-aifit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fila-outfit-prod
  template:
    metadata:
      labels:
        app: fila-outfit-prod
    spec:
      imagePullSecrets:
        - name: knowledge-base-prod-cre1
      containers:
      - name: fila-outfit-prod
        image: "${IMAGE_PATH}"
        command: ["uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "8080", "--workers", "4"]
        env:
          - name: ANTA_API_KEY
            value: "d7d3c7896894a7e127b61fc1d676f217"
          - name: ARK_API_KEY
            value: "dde807f9-4ed4-4296-b7aa-9ca63f9d83b5"
          - name: ANTA_LLM_API_KEY
            value: "9d6a6815e1c14f5c204b750fefb71e70"
          - name: ES_USERNAME
            value: "elastic"
          - name: ES_PASSWORD
            value: "l5v4oIBD0D"
          - name: FILA_MILVUS_USERNAME
            value: "root"
          - name: FILA_MILVUS_PASSWORD
            value: "1HZtcy$7qd"
          - name: HIVE_USERNAME
            value: "u_mgs"
          - name: HIVE_PASSWORD
            value: "mMyhIP75"
          - name: NGROK_AUTHTOKEN
            value: "3FNR6bpe33yODKdwSh6SFQFfg7d_6G3ieGz4vzqu3VXAt2GVR"
          - name: FEISHU_CC_APP_ID
            value: "cli_a9583a277e381bc9"
          - name: FEISHU_CC_APP_SECRET
            value: "L044dVnzLf4MHLfIuxUuYfML2Z76r7JP"
          - name: FEISHU_NT_APP_ID
            value: "cli_aacb71cf3e37dbfc"
          - name: FEISHU_NT_APP_SECRET
            value: "2mV7QAyQTyabRQ39N2W7WhYGNmQg0Lpx"
        ports:
          - containerPort: 8080
        imagePullPolicy: Always
        startupProbe:
          httpGet:
            path: /health
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 18
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
            scheme: HTTP
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
            scheme: HTTP
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
          successThreshold: 1
        resources:
          limits:
            cpu: '4'
            memory: 8Gi
          requests:
            cpu: '4'
            memory: 8Gi
