kind: Deployment
apiVersion: apps/v1
metadata:
  name: fila-sales-pitch-dev
  namespace: mgs-d
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fila-sales-pitch-dev
  template:
    metadata:
      labels:
        app: fila-sales-pitch-dev
    spec:
      imagePullSecrets:
        - name: knowledge-base-prod-cre1
      containers:
      - name: fila-sales-pitch-dev
        image: "${IMAGE_PATH}"
        command: ["uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "8080", "--workers", "4"]
        env:
          - name: DASHSCOPE_API_KEY
            value: ""
          - name: ANTA_LLM_API_KEY
            value: ""
          - name: REDIS_HOST
            value: "localhost"
          - name: REDIS_PORT
            value: "6379"
          - name: MYSQL_URL
            value: ""   # 例：mysql+pymysql://user:pass@mysql-host:3306/fila_sales_pitch?charset=utf8mb4
        ports:
          - containerPort: 8080
        imagePullPolicy: Always
        startupProbe:
          httpGet:
            path: /health
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 18
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
            scheme: HTTP
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
            scheme: HTTP
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
          successThreshold: 1
        resources:
          limits:
            cpu: '4'
            memory: 8Gi
          requests:
            cpu: '4'
            memory: 8Gi
