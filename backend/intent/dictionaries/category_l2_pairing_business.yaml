# 中类(category_l2)搭配规则（业务版）
# 填写说明：
#   - 锚点中类：用户选中商品或指定品类的中类
#   - 角色：该中类在搭配中的角色（上装/下装/外套/鞋/包/配饰/连衣裙）
#   - 可搭配中类：推荐系统允许召回的互补中类
#   - 不可搭配中类（可选）：明确禁忌，如「同为鞋类不可叠穿」「连衣裙+下装」
#   - 备注：业务说明，如使用场景、搭配建议
#
# 数据来源：data/tables 共现统计，共 54 个中类
# 通用禁忌：同角色商品不可叠穿（上装+上装、下装+下装、鞋+鞋、包+包、外套+外套、配饰+配饰）
#           连衣裙不可再配下装；运动文胸不可单穿作上装（需外套覆盖）

中类搭配:

  # ============ 上装 ============
  梭织上衣:
    角色: 上装
    可搭配: [包, 半身裙, 梭织长裤, 老爹鞋]
    不可搭配: [其他上装, 连衣裙]
    备注: 梭织面料偏挺括，多用于商务/休闲场景

  套头卫衣:
    角色: 上装
    可搭配: [梭织两件套]
    不可搭配: [其他上装, 连衣裙]
    备注: 卫衣偏休闲运动风，可与梭织外套叠穿

  短袖POLO:
    角色: 上装
    可搭配: [包, 半身裙, 梭织长裤, 老爹鞋]
    不可搭配: [其他上装, 连衣裙]
    备注: POLO衫偏商务休闲，FILA 经典高尔夫线

  短袖T恤:
    角色: 上装
    可搭配: [休闲鞋, 凉鞋, 包, 半身裙, 帆布鞋, 帽子, 户外鞋, 板鞋, 梭织五分裤, 梭织短裤, 梭织长裤, 老爹鞋, 针织长裤]
    不可搭配: [其他上装, 连衣裙]
    备注: 短袖T恤为夏季主力上装，搭配范围最广

  短袖梭织上衣:
    角色: 上装
    可搭配: []  # 数据无统计，按通用规则
    不可搭配: [其他上装, 连衣裙]
    备注: 梭织短袖偏防晒/商务，搭配下装为主

  短袖编织衫:
    角色: 上装
    可搭配: [包, 半身裙, 老爹鞋]
    不可搭配: [其他上装, 连衣裙]
    备注: 编织面料偏复古，FILA 经典网球风

  短袖衬衫:
    角色: 上装
    可搭配: []  # 数据无统计，按通用规则
    不可搭配: [其他上装, 连衣裙]
