# 搭配冲突规则（YAML 驱动，新增冲突类型只改此文件不改代码）
#
# 每条规则定义 anchor 和 companion 的属性匹配条件，命中则执行 action。
# 属性来源：backend/intent/sku_attributes.py 的 extract_* 函数
#   - layer:        base(内搭) / mid(中间层) / outer(外套) / n/a
#   - coverage:     upper(上身) / lower(下身) / full(全身) / feet / head / n/a
#   - length_class: short(短款) / long(长款) / n/a
#   - is_intimate:  true / false
#   - role:         top / bottoms / shoes / accessory / dress / unknown
#   - scene_domain: daily(日常服) / golf / tennis / gym / running / outdoor
#                   / ski / swim / cycling / basketball / ""(中性：配件/休闲鞋等)
#
# 匹配语义：
#   - 列表值 → 任一命中即匹配（OR）
#   - 单值   → 精确匹配
#   - 省略   → 该属性不参与判定（通配）
#
# scene_domain 有向搭配允许表：anchor 域 → 可召回的 companion 域列表。
# 有向/非对称：写 gym:[tennis] 仅表示 gym 锚点可推 tennis 候选；tennis 能否
# 推 gym 须另写 tennis:[gym]。daily 不再硬编码，按普通键处理，可与任意域并。
# 中性 "" 不在此表——companion="" 始终放行（配件跨场景复用）；
#   anchor="" / 未知 / 未列域 → 不约束、全量召回。
# pre-filter（build_scene_domain_milvus_expr / build_scene_domain_es_filter）正向
# 放行 allow 集 ∪ {""}；成对安全网（check_companion_conflict）据本表派生有向
# reject：companion 域 ∉ allow[anchor] 且 ≠ "" → reject。配置由
# outfit_conflict.py 的 _load_scene_config 加载，同时驱动 Milvus/ES 下推与安全网。

scene_allow:
  daily: [daily]
  gym: [gym,daily]
  tennis: [tennis]
  golf: [golf]
  running: [running]
  outdoor: [outdoor]
  ski: [ski]
  swim: [swim]
  cycling: [cycling]
  basketball: [basketball,daily,tennis,golf]

# series 有向搭配允许表：anchor 系列 → 额外允许的 companion 系列列表。
# series 是开放枚举（子品牌线/联名胶囊，如 ORIGINALE/GOLF/HERITAGE/FILA X NEMEN），
# 默认每个系列同系-only（自身 + 无系列 ""），此处仅写跨系列例外。
# 与 scene_allow 的差异：scene 未列域→不约束；series 未列系列→self-only。
# 中性 "" 不入表——companion="" 始终放行（无系列伴品跨系列复用）；
#   anchor 无 series / 空串 → 不约束、全量召回。
# pre-filter（build_series_milvus_expr / build_series_es_filter）正向放行
# 允许集 ∪ {""}；安全网 _series_conflict 兜底（开放枚举无法派生 reject 规则）。
series_allow:
  # 例：FILA FUSION 三个子线互搭（双向须各写一行）
  # "FILA FUSION LIFE": ["FILA FUSION X", "FILA FUSION CLASSICS"]
  # "FILA FUSION X": ["FILA FUSION LIFE", "FILA FUSION CLASSICS"]
  # "FILA FUSION CLASSICS": ["FILA FUSION LIFE", "FILA FUSION X"]

rules:
  - name: "长袖上装 × 短款下装季节冲突"
    description: "长袖/保暖类上装暗示春秋冬，短裤/五分/七分裤/短裙暗示夏季，不应搭配"
    anchor:
      role: ["top"]
      gender: ["男"]
      length_class: ["long"]
    companion:
      role: ["bottoms"]
      length_class: ["short"]
    action: reject
  - name: "长袖上装 × 短款下装季节冲突"
    description: "长袖/保暖类上装暗示春秋冬，短裤/五分/七分裤/短裙暗示夏季，不应搭配"
    anchor:
      role: ["bottoms"]
      gender: ["男"]
      length_class: ["short"]
    companion:
      role: ["top"]
      length_class: ["long"]
    action: reject
  - name: "连体/全身装 × 上下装冲突"
    description: "连衣裙/连体裤/背带裤已覆盖全身，不应再搭配上装或下装"
    anchor:
      coverage: ["full"]
    companion:
      role: ["top", "bottoms"]
    action: reject

  - name: "全身装互斥"
    description: "两件全身装（如连衣裙×连衣裙）不应搭配"
    anchor:
      coverage: ["full"]
    companion:
      coverage: ["full"]
    action: reject

  - name: "同层叠穿冲突"
    description: "两件内搭或两件外套不应搭配（应 base+outer 或 base+mid）"
    anchor:
      role: ["top"]
      layer: ["base"]
    companion:
      role: ["top"]
      layer: ["base"]
    action: reject
