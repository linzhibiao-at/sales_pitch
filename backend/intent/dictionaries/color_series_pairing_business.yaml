# 色系搭配规则（业务版）
# 填写说明：
#   - 锚点色系：用户选中商品或指定颜色的色系
#   - 可搭配色系：推荐系统允许召回的互补色系
#   - 不可搭配色系（可选）：明确禁忌，如「大面积红配绿」
#   - 备注：业务说明，如使用场景、搭配建议
#
# 数据来源：data/tables/fila_sku_outfit_colors.csv 共 8580 条有效记录统计
# 锚点角色：上装 / 伴侣角色：下装；共 12 个色系

色系搭配:
  黑色系:
    可搭配: [白色系, 灰色系, 棕色系, 蓝色系, 绿色系]
    不可搭配: []  # 黑色百搭，无禁忌
    备注: 经典黑白灰永不过时；与浅色下装形成强对比，显精神

  白色系:
    可搭配: [黑色系, 蓝色系, 灰色系, 棕色系, 绿色系, 粉色系]
    不可搭配: []  # 白色百搭，无禁忌
    备注: 白色上装可适配几乎所有下装；与黑色搭配为经典对比

  灰色系:
    可搭配: [黑色系, 蓝色系, 白色系, 棕色系]
    不可搭配: []  # 灰色为中性色，无明确禁忌
    备注: 灰色为中性过渡色，与任何色系搭配均安全

  蓝色系:
    可搭配: [黑色系, 白色系, 灰色系, 棕色系]
    不可搭配: []  # 蓝色为冷调中性色，无明确禁忌
    备注: 蓝色（含藏青/海蓝）为运动品牌主力色，搭配范围广

  棕色系:
    可搭配: [黑色系, 白色系, 蓝色系, 绿色系, 灰色系]
    不可搭配: [粉色系]  # 大面积棕粉撞色违和
    备注: 棕色（含卡其/咖色）偏复古调，与黑/白/蓝搭配最稳妥

  红色系:
    可搭配: [黑色系, 蓝色系, 白色系, 灰色系]
    不可搭配: [绿色系, 紫色系]  # 大面积红绿/红紫需谨慎
    备注: 红色作点缀色更稳妥；与黑色搭配为运动品牌经典撞色

  粉色系:
    可搭配: [黑色系, 白色系, 蓝色系, 灰色系]
    不可搭配: [红色系, 橙色系]  # 粉红/粉橙同色系易显廉价
    备注: FILA 少女线常用粉+白/灰；粉+黑为潮流对比

  橙色系:
    可搭配: [黑色系, 蓝色系, 灰色系, 白色系, 绿色系, 棕色系]
    不可搭配: [粉色系, 紫色系]  # 橙粉/橙紫撞色刺眼
    备注: 橙色活力感强；与黑色搭配为运动品牌常用撞色

  黄色系:
    可搭配: [黑色系, 蓝色系, 白色系, 灰色系, 绿色系, 棕色系]
    不可搭配: [粉色系, 紫色系]  # 黄粉/黄紫撞色刺眼
    备注: 黄色明度高；与黑色对比为街头潮流常用

  绿色系:
    可搭配: [黑色系, 白色系, 灰色系, 蓝色系, 棕色系]
    不可搭配: [红色系]  # 大面积红绿撞色违和
    备注: 绿色（含军绿/橄榄）与卡其/黑搭配为户外复古风

  紫色系:
    可搭配: [黑色系, 白色系, 蓝色系, 灰色系]
    不可搭配: [红色系, 橙色系, 黄色系]  # 紫红/紫橙/紫黄撞色刺眼
    备注: 紫色饱和度高时风险大；与黑/白搭配最安全

  多色系:
    可搭配: [黑色系, 白色系, 灰色系, 蓝色系]
    不可搭配: [多色系]  # 花款上衣配花款下装视觉过载
    备注: 花款（拼色/印花）上装配纯色下装/鞋，避免视觉过载
