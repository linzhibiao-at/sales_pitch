# 中类(category_l2)搭配规则（业务版 - LLM 笛卡尔积打分）
# 填写说明：
#   - 锚点中类：用户选中商品或指定品类的中类
#   - 角色：该中类在搭配中的角色（上装/下装/鞋/配饰/连衣裙）
#   - 可搭配中类：推荐系统允许召回的互补中类
#   - 备注：业务说明，如使用场景、搭配建议
#
# 数据来源：LLM 笛卡尔积打分，共 82 个中类
# 通用规则：同角色商品不叠穿（上装+上装、下装+下装、鞋+鞋、配饰+配饰）
#           连衣裙/连体裤不再配下装；运动文胸不可单穿作上装

