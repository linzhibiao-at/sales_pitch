# FILA 营销话术服务 — 路径相对本文件所在目录
#
# 由穿搭推荐工程裁剪而来：仅保留营销话术生成（/v1/sales-pitch/generate）
# 所需配置。启动/部署方式不变（uvicorn backend.main:app，见 Dockerfile）。

# 对外接口 app_id 白名单: 列表内为合法调用方; 非白名单返 401 invalid app_id。
# - 键缺失 → 不强制(向后兼容, 任何非空 app_id 通过)
# - 键存在(含空列表) → 强制校验
allowed_app_ids:
  - micro_guide
  - wechat_mini

# 对外接口 API Key 鉴权 + 限流排队（docs/FILA接口鉴权与限流方案.md）
# 限流为进程内实现(不引 Redis), 8 worker 下为单进程近似。
auth:
  enabled: true               # 鉴权总开关(上线灰度时改 true)
  header_name: "X-API-Key"
  keys_file: "config/api_keys.yaml"   # Key 白名单文件(不入 Git)
  log_only: false               # 过渡期: 无/错 Key 仅记日志不拦截
  rate_limit:
    default_qpm: 100            # 默认每分钟请求数(硬限制)
    default_daily: 10000        # 默认每日调用量(硬限制)
    default_concurrent: 5       # 默认最大并发(软限制, 排队)
    default_queue_size: 20      # 默认排队队列容量
    default_queue_timeout: 30   # 默认排队超时(秒)

paths:
  logs_dir: "data/logs"
  prompt_dir: "prompt"

prompt_files:
  sales_pitch: "prompt/sales_pitch.md"

models:
  # 营销话术生成（/v1/sales-pitch/generate）：创意生成任务，temperature 在调用侧调高
  sales_pitch_llm:
    provider: openai_compatible
    mode: local
    base_url: "https://ai.anta.com/aimodels-server/private/llm/v1"
    api_key_env: "ANTA_LLM_API_KEY"
    model: "qwen3.5-flash"
    timeout_sec: 120
    enable_thinking: false
    max_tokens: 2048
    max_retries: 2          # 单模型重试次数；耗尽后按 fallback_models 换模型再调
    retry_delay_sec: 2
    fallback_models: ["qwen3.7-plus"]

elasticsearch:
  enabled: false
  # 环境变量 ES_HOSTS 可覆盖（逗号分隔多节点）
  hosts:
    - "https://es-cn-4ta4vp6dm00010t6f.elasticsearch.aliyuncs.com:9200"
  # 账号通过环境变量注入，勿写入本文件：
  #   export ES_USERNAME=maiamgs-dev
  #   export ES_PASSWORD='...'   # 含 # 等特殊字符须单引号
  username_env: "ES_USERNAME"
  password_env: "ES_PASSWORD"
  indices:
    # 对外请求审计落库（输入/结果），需预先在该集群创建
    requests: "umalog-q-maiamgs-index-fila-requests"
  # 对外请求审计开关：false 时既不写也不查（查询 API 返空/503）
  request_audit:
    enabled: true

logging:
  level: "INFO"
  format: "jsonl"
  output: "file"
  base_dir: "data/logs"
  debug_api_io: true
  redact:
    image_base64: true
    api_key: true
    prompt_max_chars: 2000
