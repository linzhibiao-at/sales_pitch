x-status: active
x-owner: '@linzhibiao'
openapi: 3.0.3
info:
  title: FILA Sales Pitch Service API
  version: 0.1.0
  description: |
    FILA 营销话术生成服务 API 规范（与 backend/routers/ 实现一一对应）。
    错误统一信封 {code, message, trace_id}，错误码字典见 error-codes.md。
    鉴权：config.yaml auth.enabled=true 时，受保护接口须带 X-API-Key 头。
paths:
  /v1/sales-pitch/generate:
    post:
      summary: 生成营销话术（顾客画像 + 商品信息 → 导购话术）
      tags: [sales_pitch]
      security:
        - ApiKeyAuth: []
      parameters:
        - name: X-API-Key
          in: header
          required: false   # auth.enabled=true 时必填；log_only 灰度期放行
          schema: {type: string}
          description: API Key 白名单见 config/api_keys.yaml（不入 Git）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalesPitchRequest'
      responses:
        '200':
          description: 生成成功；同一 session_id 续传可进行多轮迭代
          headers:
            X-Trace-Id: {schema: {type: string}, description: 请求追踪 ID（uuid4 hex）}
            X-Queue-Status: {schema: {type: string}, description: immediate | queued（排队发生时）}
            X-Queue-Wait: {schema: {type: string}, description: 排队等待秒数}
            X-Queue-Position: {schema: {type: string}, description: 入队时位置}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesPitchResponse'
        '400': {description: app_id required, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '401': {description: 鉴权失败（缺 Key / Key 无效 / app_id 白名单外 / Key 绑定不匹配）, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '403': {description: Key 无该接口权限, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '422': {description: 入参校验失败（字段级错误串）, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '429': {description: 限流 / 排队（QPM / 日量 / 队列满 / 排队超时）, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '500': {description: 未捕获异常兜底, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '503': {description: Agent 栈初始化失败或空输出（服务降级）, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
  /v1/audit/requests:
    get:
      summary: 请求审计列表（只读，运维接口，不鉴权）
      tags: [audit]
      parameters:
        - {name: trace_id, in: query, schema: {type: string}}
        - {name: app_id, in: query, schema: {type: string}}
        - {name: session_id, in: query, schema: {type: string}}
        - {name: request_kind, in: query, schema: {type: string, default: sales_pitch}}
        - {name: status, in: query, schema: {type: string, enum: [ok, error]}}
        - {name: ts_from, in: query, schema: {type: string}, description: ISO 时间下界（含）}
        - {name: ts_to, in: query, schema: {type: string}, description: ISO 时间上界（含）}
        - {name: size, in: query, schema: {type: integer, default: 50, maximum: 200}}
        - {name: offset, in: query, schema: {type: integer, default: 0}}
        - {name: page, in: query, schema: {type: integer, minimum: 1}, description: 1 起；与 offset 二选一，page 优先}
      responses:
        '200':
          description: 审计关闭或 MySQL 不可用时返回 {enabled:false,total:0,items:[]}（静默降级，不报错）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditListResponse'
  /v1/audit/requests/{trace_id}:
    get:
      summary: 请求审计详情（完整文档）
      tags: [audit]
      parameters:
        - {name: trace_id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: 完整审计文档（含 input / result JSON 块；话术正文截前 600 字）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditDetail'
        '404': {description: not found, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '503': {description: audit disabled（审计关闭）, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
  /v1/users/me:
    get:
      summary: 当前用户（占位实现，未接鉴权，接入前勿对外依赖）
      tags: [user]
      responses:
        '200':
          description: 占位响应
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserMeResponse'
  /health:
    get:
      summary: 健康检查（Agent 栈初始化失败时仍返回 200 ok）
      tags: [ops]
      responses:
        '200':
          description: 服务存活
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    SalesPitchRequest:
      type: object
      required: [app_id, guide_num, customer, products]
      properties:
        app_id: {type: string, description: 调用方标识，须在 allowed_app_ids 白名单内且与 Key 绑定一致}
        guide_num: {type: string, minLength: 1, description: 导购工号（导购身份标识，必传）；开关与白名单见 guide_auth 配置段}
        customer:
            $ref: '#/components/schemas/SalesPitchCustomerInfo'
        products:
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: '#/components/schemas/SalesPitchProductInfo'
        promotions:
          type: array
          maxItems: 10
          description: 门店已选活动（可选）；非空时注入【促销活动】块，缺省或空数组均不注入
          items:
            $ref: '#/components/schemas/SalesPitchPromotionInfo'
        coupon_names:
          type: array
          maxItems: 20
          description: "已核验且已选的顾客券名（可选）：非空注入【顾客优惠券】块；显式空数组（或清理后为空）触发“会员专属优惠”兜底；缺省不注入且无兜底（与空数组语义不同）"
          items: {type: string, description: 单项清理后 ≤100 字符；清理后为空的项被剔除}
        pitch_style: {type: string, description: warm | professional | concise（预设）或四档语气：亲切自然 | 活力潮流 | 专业尊贵 | 简约高效；其余自由描述原样透传}
        max_length: {type: integer, minimum: 0, description: 话术字数上限（0 或缺省不限）}
        extra_prompt: {type: string, maxLength: 500, description: 导购自由补充要求（可选）；非空时作为【补充要求】块注入 prompt，空值不注入}
      description: 入参经 Pydantic 清理（HTML 标签剥除 + lone surrogate 剔除）
    SalesPitchCustomerInfo:
      type: object
      required: [union_id]
      description: 顾客画像；union_id 必传（用于确定性生成 session_id），其余字段按需传入；未提供的维度不注入 prompt
      properties:
        union_id: {type: string, description: 会员标识（必传）：微信 unionid 等平台标识，用于确定性生成 session_id}
        nickname: {type: string, description: 顾客称呼，如"王女士"}
        gender: {type: string}
        age: {type: string, description: 年龄段或具体年龄，如"35""大学生"}
        member_level: {type: string, description: 会员等级，如"金卡会员"}
        points: {type: integer, minimum: 0, description: 会员积分（非负）}
        extra: {type: object, additionalProperties: true, description: 扩展字段，以"字段名→值"原样注入 prompt}
    SalesPitchProductInfo:
      type: object
      required: [title]
      properties:
        title: {type: string, description: 商品名称（清理后须非空）}
        color: {type: string}
        extra: {type: object, additionalProperties: true}
    SalesPitchPromotionInfo:
      type: object
      required: [promo_id, copy]
      description: 门店已选活动（POS 促销）；promo_id 仅供审计溯源，不注入提示词
      properties:
        promo_id: {type: string, description: 活动标识（清理后须非空）}
        name: {type: string, description: 活动名（可选），作为 prompt 行前缀}
        copy: {type: string, description: 活动展示文案（清理后须非空）；话术仅可引用该原文，禁止编造}
    SalesPitchResponse:
      type: object
      properties:
        session_id: {type: string, description: 本轮会话 ID（多轮续传用）}
        pitch: {type: string, description: 话术正文（可直接发给顾客）}
        pitch_style: {type: string}
        model: {type: string, description: 实际生效的主模型名}
        trace_id: {type: string, description: 与 X-Trace-Id 一致，可查审计}
    ErrorResponse:
      type: object
      required: [code, message, trace_id]
      properties:
        code: {type: integer, description: HTTP 状态码（错误码字典见 error-codes.md）}
        message: {type: string, description: ≤500 字}
        trace_id: {type: string}
    AuditListResponse:
      type: object
      properties:
        enabled: {type: boolean}
        total: {type: integer}
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditItem'
    AuditItem:
      type: object
      description: 精简行（slim_audit_row），话术只含前 80 字
      properties:
        trace_id: {type: string}
        session_id: {type: string}
        app_id: {type: string}
        request_kind: {type: string}
        ts: {type: string}
        created_at: {type: string}
        elapsed_ms: {type: integer}
        status: {type: string}
        pitch_style: {type: string}
        pitch: {type: string}
        product_count: {type: integer}
        has_customer: {type: boolean}
        pitch_len: {type: integer}
    AuditDetail:
      type: object
      properties:
        trace_id: {type: string}
        session_id: {type: string}
        app_id: {type: string}
        caller: {type: string, description: Key 绑定的调用方}
        request_kind: {type: string}
        ts: {type: string}
        elapsed_ms: {type: integer}
        status: {type: string}
        error: {type: string, nullable: true}
        input: {type: object, description: "入参快照（session_id/guide_num/customer/products/promotions/coupon_names/pitch_style/max_length/extra_prompt；promotions 为 promo_id/name/copy 结构（by_alias），coupon_names 区分缺省 null 与显式 []）"}
        intent: {type: string, nullable: true, description: 历史字段，恒 null}
        recall: {type: string, nullable: true, description: 历史字段，恒 null}
        ranking: {type: string, nullable: true, description: 历史字段，恒 null}
        result:
          type: object
          nullable: true
          properties:
            pitch: {type: string, nullable: true, description: 截前 600 字}
            pitch_len: {type: integer}
            error: {type: string, description: 失败时的错误串}
    UserMeResponse:
      type: object
      properties:
        user_id: {type: string}
    HealthResponse:
      type: object
      properties:
        status: {type: string, example: ok}
        service: {type: string, example: sales_pitch}
